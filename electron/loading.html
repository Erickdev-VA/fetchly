<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Fetchly</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a0c;
        color: #f2f2f4;
        font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      .name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .bar {
        position: relative;
        width: 140px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: #635bff;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div class="name">Fetchly</div>
    <div class="bar" role="progressbar" aria-label="Starting Fetchly"></div>
  </body>
</html>
